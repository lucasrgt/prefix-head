[workspace]
resolver = "3"
members = ["crates/kern", "crates/ruler", "crates/tok", "crates/nn", "crates/bench", "crates/alpha", "crates/retro", "crates/gem"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
